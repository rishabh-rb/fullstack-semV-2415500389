
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cricket Ball Slider</title>
  <style>
    #pitch {
      position: relative;
      width: 400px;
      max-width: 100%;
      height: 100px;
      background: #b8df9b;
      overflow: hidden;
      border: 2px solid #555;
    }

    #ball {
      position: absolute;
      left: 0;
      top: 35px;
      width: 25px;
      height: 25px;
      background: crimson;
      border-radius: 50%;
    }

    #zones {
      display: flex;
      width: 100%;
      max-width: 404px;
    }

    #zones span {
      flex: 1;
      text-align: center;
      padding: 6px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Cricket Ball Slider</h2>
  <p>Hit the ball when it reaches the scoring zone!</p>

  <div id="pitch">
    <div id="ball"></div>
  </div>

  <div id="zones">
    <span>0 runs</span>
    <span>1 run</span>
    <span>2 runs</span>
    <span>4 runs</span>
    <span>6 runs</span>
  </div>

  <button id="hit">Hit!</button>
  <button id="newBall">New Ball</button>
  <p id="result">Ready to play!</p>
  <p>Total runs: <span id="score">0</span></p>

  <script>
    const ball = document.getElementById("ball");
    const pitch = document.getElementById("pitch");
    const result = document.getElementById("result");

    let position = 0, speed = 0, score = 0;
    let timer = null, active = false;

    function newBall() {
      clearInterval(timer);
      position = 0;
      speed = 2 + Math.random() * 5;
      active = true;
      ball.style.left = "0px";
      result.textContent = "Ball moving! Time your hit.";

      timer = setInterval(() => {
        position += speed;

        const maxPosition = pitch.clientWidth - ball.offsetWidth;

        if (position >= maxPosition) {
          position = maxPosition;
          ball.style.left = position + "px";
          clearInterval(timer);
          active = false;
          result.textContent = "Ball missed! Try another ball.";
          return;
        }

        ball.style.left = position + "px";
      }, 20);
    }

    document.getElementById("hit").onclick = () => {
      if (!active) {
        result.textContent = "Start a new ball first!";
        return;
      }

      clearInterval(timer);
      active = false;

      const maxPosition = pitch.clientWidth - ball.offsetWidth;
      const ratio = position / maxPosition;

      let runs;
      if (ratio < 0.2) runs = 0;
      else if (ratio < 0.4) runs = 1;
      else if (ratio < 0.6) runs = 2;
      else if (ratio < 0.8) runs = 4;
      else runs = 6;

      score += runs;
      document.getElementById("score").textContent = score;
      result.textContent = `You scored ${runs} run(s)!`;
    };

    document.getElementById("newBall").onclick = newBall;
    newBall();
  </script>
</body>
</html>
