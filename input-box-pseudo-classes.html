<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        input{
            margin:3px;
            border-width:0 0 2px 0;
            border-color:blue;
        }
        input:required{
            font-family:Arial;
        }
        input:optional{
            font-family:montana;
        }
    </style>
</head>
<body>
    <form>
        <input type="text" placeholder="First Name" required><br><br>
        <input type="text" placeholder="Middle Name" optional><br><br>
        <input type="text" placeholder="Last Name" required><br><br>
    </form>
    
</body>
</html>
