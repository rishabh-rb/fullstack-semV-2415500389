<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Click Counter</title>
</head>
<body>
    <button onclick="clicked()">Click Me</button>
    <p id="counterDisplay">0</p>
    <script>
        var count = 0;
        function clicked(){
            count++;
            document.getElementById("counterDisplay").innerText = count;
        }
    </script>
</body>
</html>
